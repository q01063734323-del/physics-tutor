<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07142B">
  <meta name="robots" content="noindex">
  <title>Нет соединения · Физика с Егором</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));background:#07142b;color:#f1f6ff;font-family:system-ui,-apple-system,sans-serif}main{width:min(100%,460px)}img{width:96px;height:96px;border-radius:22px;display:block;box-shadow:0 12px 45px #0005}small{display:block;margin-top:28px;color:#87b9ff;letter-spacing:.08em;font-size:12px}h1{font-size:clamp(34px,7vw,48px);line-height:1.12;letter-spacing:-.04em;font-weight:600;margin:12px 0 18px}p{color:#bac8dd;font-size:17px;line-height:1.65;margin:0 0 30px}button{min-height:48px;padding:12px 24px;background:#c0dcff;border:0;border-radius:9px;color:#07142b;font:600 16px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:5px}button:hover{background:#e0edff}
  </style>
</head>
<body><main>
  <img src="/icons/icon-192.png" alt="Физика с Егором" width="96" height="96">
  <small>ФИЗИКА С ЕГОРОМ</small>
  <h1>Вернёмся к физике,<br>когда появится сеть.</h1>
  <p>Проверьте подключение к интернету. После восстановления связи кабинет загрузит актуальные задания и результаты.</p>
  <button type="button" id="retry">Повторить подключение</button>
</main><script>
  document.getElementById('retry').addEventListener('click', function () {
    if (window.location.pathname === '/offline.html') window.location.assign('/');
    else window.location.reload();
  });
</script></body>
</html>
